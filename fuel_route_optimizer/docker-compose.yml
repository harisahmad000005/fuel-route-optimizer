services:
  web:
    build:
      context: .

    environment:
      SECRET_KEY: django-insecure-docker-only
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: fuel_optimizer
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:17-3.5

    environment:
      POSTGRES_DB: fuel_optimizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuel_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
